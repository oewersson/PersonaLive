<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="90" fill="none" viewBox="0 0 800 90"><foreignObject width="100%" height="100%"><div xmlns="http://www.w3.org/1999/xhtml"><style>@keyframes rainbow-flow{0%{background-position:0 center}}.rainbow-text-container{display:flex;justify-content:center;align-items:center;height:100%;background-color:transparent}.rainbow-text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif;font-size:70px;font-weight:900;text-align:center;background-image:linear-gradient(to right,#ff6b6b,#ff9e42,#f0c330,#6bcb77,#4d96ff,#9d78e3,#ff6b6b);background-size:200% auto;animation:rainbow-flow 4s linear infinite;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;filter:drop-shadow(0 2px 4px rgba(0,0,0,.15))}</style><div class="rainbow-text-container"><div class="rainbow-text">PersonaLive!</div></div></div></foreignObject></svg>